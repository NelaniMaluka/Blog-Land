name: Deploy to Firebase Hosting on merge
on:
  push:
    branches:
      - main

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

        # Clean old releases, keep only latest 5
      - name: Delete old Firebase Hosting releases
        run: |
          firebase hosting:releases:list --project blog-land --json \
          | jq -r '.releases | sort_by(.created) | .[:-5] | .[].releaseId' \
          | xargs -r -I {} firebase hosting:releases:delete {} --project blog-land --non-interactive
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}

      - name: Install dependencies
        run: npm ci --legacy-peer-deps
        working-directory: ./blog-land-frontend

      - name: Create .env file
        run: |
          echo "VITE_YOUTUBE_API_KEY=${{ secrets.VITE_YOUTUBE_API_KEY }}" > ./blog-land-frontend/.env
          echo "VITE_GOOGLE_MAPS_API_KEY=${{ secrets.VITE_GOOGLE_MAPS_API_KEY }}" >> ./blog-land-frontend/.env

      - name: Build frontend
        run: npm run build
        working-directory: ./blog-land-frontend

      - name: Deploy to Firebase
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_BLOG_LAND }}
          channelId: live
          projectId: blog-land
          entryPoint: ./blog-land-frontend # for monorepo structure
